# Registry-allowlist proxy (ADR-0001 / decision 6a).
#
# A CONNECT-allowlist forward proxy fronting package registries. It does NOT terminate TLS and
# does NOT log — its only job is "commands may reach these hostnames and nothing else." This is
# the registry exception to "commands get zero network", and is NOT the logging proxy that was
# declined. CDN-backed registries change IPs constantly, so hostname filtering (here) is the only
# robust way to express the allowlist; a pure IP firewall cannot.

User ccproxy
Group nogroup

# Loopback only: the firewall already blocks `runner` from reaching anything but loopback, so the
# only client that can ever connect is an in-box command.
Listen 127.0.0.1
Port 8118
Allow 127.0.0.1

Timeout 600
MaxClients 100

# No logging (declined). Critical-only, discarded.
LogLevel Critical
LogFile "/dev/null"
PidFile "/run/cc-sandbox/tinyproxy.pid"

# Hostname allowlist. FilterDefaultDeny => only listed hosts pass; everything else is refused.
Filter "/etc/cc-sandbox/registry-filter"
FilterExtended On
FilterDefaultDeny Yes

# HTTPS goes through CONNECT; restrict to the standard secure ports.
ConnectPort 443
ConnectPort 563
