name: publish-image

# Builds the Sandbox policy image and publishes it to GHCR.
# The `stable` tag is the trusted moving tag the Wrapper pulls via --pull=always, so a push here
# propagates policy/security fixes to the whole fleet on their next run. Because that tag is
# load-bearing for the WHOLE fleet, publishing is gated on the security harness passing first.

on:
  push:
    branches: [main]
    paths: ['image/**', 'bin/**', 'test/**', '.github/workflows/publish-image.yml']
    tags: ['v*']
  pull_request:
    paths: ['image/**', 'bin/**', 'test/**', '.github/workflows/publish-image.yml']
  # Weekly rebuild so base-OS / Node / Rust security patches reach the fleet even when no file
  # changes. The pinned Claude Code version (image/Dockerfile) is bumped separately by Renovate.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  # Gate: build the image and assert the core security invariants (no root escalation, immutable
  # firewall, command-egress blocked, token unreadable). Uses the SAME run policy the Wrapper applies
  # (sourced via `cc-sandbox --print-run-policy`), and swaps in test/payload.sh so no Claude quota is used.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image for testing
        run: docker build -t cc-sandbox:ci ./image

      - name: Run security harness
        run: ./test/security-harness.sh cc-sandbox:ci

  build-and-push:
    needs: test
    # Don't publish on PRs (no GHCR write / not the trusted source) — the test job still runs there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner cross-build the arm64 variant so Apple Silicon hosts can pull.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/cc-sandbox
          tags: |
            type=raw,value=stable,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
