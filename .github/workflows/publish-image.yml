name: publish-image

# Builds the Sandbox policy image and publishes it to GHCR.
# The `stable` tag is the trusted moving tag the Wrapper pulls via --pull=always, so a push here
# propagates policy/security fixes to the whole fleet on their next run.

on:
  push:
    branches: [main]
    paths: ['image/**', '.github/workflows/publish-image.yml']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cc-sandbox
          tags: |
            type=raw,value=stable,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
